<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7d0c14">
<title>Stats Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<style>
  /* Direction: the page is the object. A paper exam sheet in a red folder; weeks are its tabs. */
  :root {
    --field: #7d0c14; --field-2: #8e2a31; --field-dark: #620910;
    --paper: #e2e2e2; --surface: #d6d6d6; --surface-2: #cbcbcb;
    --ink: #7d0c14; --muted: #7a4a4e;
    --step-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
    --step-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
    --step-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
    --step-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
    --pad: clamp(20px, 5vw, 48px);
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--ink); color: var(--paper); }
  body { margin: 0; background: var(--field); color: var(--ink);
    font: 400 var(--step-body)/1.5 "Bricolage Grotesque", system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; border-radius: 0;
    transition: background-color .2s, color .2s, transform .12s var(--ease); }
  button:active:not(:disabled) { transform: scale(.98); }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  header :focus-visible, .weeks :focus-visible { outline-color: var(--paper); }

  header, main, footer { width: min(640px, 100% - 24px); margin-inline: auto; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 0 28px; color: var(--paper); }
  h1 { font-size: var(--step-body); font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .mode { display: flex; }
  .mode button { min-height: 44px; padding: 0 18px; font-weight: 500; background: none; }
  .mode button[aria-pressed=true] { background: var(--paper); color: var(--ink); }

  .weeks { display: flex; align-items: flex-end; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .weeks::-webkit-scrollbar { display: none; }
  /* fade the side that has more tabs to scroll to; --l / --r are set by script */
  .weeks { mask-image: linear-gradient(to right, transparent, #000 var(--l, 0px), #000 calc(100% - var(--r, 0px)), transparent); } /* taste-skill-ignore: scroll cue, not decoration */
  /* tabs fill the sheet's width; below ~600px 13 thumb-sized tabs can't fit, so the row scrolls */
  .weeks button { flex: 1 0 auto; min-width: 44px; min-height: 44px; padding: 0 10px;
    background: var(--field-2); color: var(--paper); font-size: var(--step-small); font-weight: 500; }
  .weeks button[aria-pressed=true] { min-height: 52px; background: var(--paper); color: var(--ink); }
  @media (hover: hover) {
    .mode button[aria-pressed=false]:hover, .weeks button[aria-pressed=false]:hover { background: var(--field-dark); }
  }

  /* svh, not dvh: dvh grows as the phone's address bar hides, which stretched the sheet mid-scroll */
  .sheet { background: var(--paper); padding: var(--pad); min-height: calc(100svh - 100px); }
  .meta { display: flex; justify-content: space-between; gap: 12px; font-size: var(--step-small); color: var(--muted); margin: 0 0 12px; }
  .bar { height: 6px; background: var(--surface); }
  .bar i { display: block; height: 100%; background: var(--ink); }

  .q { font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.25rem); font-weight: 500; line-height: 1.2; letter-spacing: -0.02em; margin: 40px 0 32px; text-wrap: pretty; }
  .opts { display: grid; gap: 6px; }
  .opt { text-align: left; background: var(--surface); padding: 16px 18px; min-height: 56px; line-height: 1.4; }
  .opt.right { background: var(--field); color: var(--paper); font-weight: 500; }
  .opt.wrong { color: var(--muted); text-decoration: line-through 2px; }
  .opt:disabled { cursor: default; }
  @media (hover: hover) { .opt:not(:disabled):hover, .btn.ghost:hover { background: var(--surface-2); } }

  /* the answer slip: a tear-off band across the sheet, perforated by round dots */
  #after:not(:empty) { margin: 28px calc(-1 * var(--pad)) 0; padding: 24px var(--pad); background: var(--surface); border-top: 4px dotted var(--field); }
  .why p { margin: 0 0 10px; max-width: 60ch; }
  .why b { font-weight: 600; }
  .trap { font-weight: 600; }
  .why .src { font-size: var(--step-small); color: var(--muted); margin: 0; }

  .row { display: flex; gap: 6px; margin-top: 20px; flex-wrap: wrap; }
  .btn { flex: 1; min-height: 56px; padding: 0 16px; white-space: nowrap; background: var(--field); color: var(--paper); font-weight: 500; }
  .btn:hover { background: var(--field-dark); }
  .btn.ghost { background: var(--surface); color: var(--ink); }

  /* formula cards are index cards: 5:3, red face up, grey on the back */
  .card { width: 100%; margin-top: 28px; aspect-ratio: 5 / 3; padding: clamp(20px, 5vw, 28px);
    display: flex; flex-direction: column; justify-content: space-between; gap: 16px; text-align: left;
    background: var(--field); color: var(--paper); }
  .card.back { background: var(--surface); color: var(--ink); }
  .card > span { display: block; }
  .card .t { font-size: min(var(--step-head), 2.5rem); font-weight: 600; letter-spacing: -0.03em; line-height: 1; text-wrap: balance; }
  .card .hint { font-size: var(--step-small); }
  .card .f { font-size: var(--step-lead); }
  .card .katex-display { margin: 0 0 12px; overflow-x: auto; overflow-y: hidden; }
  .card .katex-display > .katex { text-align: left; }
  .card .n { color: var(--muted); }

  .big { font-size: clamp(4rem, 3rem + 6vw, 7.5rem); font-weight: 600; letter-spacing: -0.04em; line-height: .92; margin: 24px 0 16px; }
  .sub { font-size: var(--step-lead); color: var(--muted); margin: 0; }

  footer { padding: 56px 0 72px; color: var(--paper); }
  footer p { margin: 0; }
  footer .bye { font-size: var(--step-head); font-weight: 600; letter-spacing: -0.04em; line-height: .92; margin-bottom: 16px; }
  footer .course { max-width: 60ch; opacity: .8; }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .q, .opt, .card, .big, .sub, #after > * { animation: rise .45s var(--ease) both; }
  .opt:nth-child(1) { animation-delay: 60ms; } .opt:nth-child(2) { animation-delay: 120ms; }
  .opt:nth-child(3) { animation-delay: 180ms; } .opt:nth-child(4) { animation-delay: 240ms; }
  .opt:nth-child(n+5) { animation-delay: 300ms; } .sub, #after > .row { animation-delay: 80ms; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Stats revision</h1>
  <div class="mode" role="group" aria-label="Mode">
    <button id="mQuiz" aria-pressed="true">Quiz</button>
    <button id="mCards" aria-pressed="false">Cards</button>
  </div>
</header>
<main>
  <div class="weeks" id="weeks" role="group" aria-label="Week filter"></div>
  <div class="sheet" id="view" aria-live="polite"></div>
</main>
<footer>
  <p class="bye">You've got this.</p>
  <p class="course">Statistical Learning for Reliability Analysis · 12 weeks · theory only</p>
</footer>

<script src="data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script>
const $ = s => document.querySelector(s);
const view = $('#view');
let mode = 'quiz', week = 0;
let deck = [], i = 0, score = 0, wrong = [], done = false;
let cards = [], ci = 0, flipped = false;

const shuffle = a => { for (let j = a.length - 1; j > 0; j--) { const k = Math.random() * (j + 1) | 0; [a[j], a[k]] = [a[k], a[j]]; } return a; };
const pick = list => list.filter(x => !week || x.w === week);
// shuffle options so the answer isn't always in the same slot; keep True/False pairs in order
const order = q => { const ix = q.o.map((_, n) => n); return q.o.length > 2 ? shuffle(ix) : ix; };
// card formulas are LaTeX; if KaTeX didn't load (offline) the raw TeX still shows
const tex = (s, display) => window.katex ? katex.renderToString(s, { displayMode: display, throwOnError: false }) : s;
const inline = s => s.replace(/\$(.+?)\$/g, (_, m) => tex(m, false));

function weeks() {
  $('#weeks').innerHTML = ['All', ...Array.from({ length: 12 }, (_, n) => n + 1)]
    .map((t, n) => `<button aria-pressed="${n === week}" data-w="${n}"${n ? ` aria-label="Week ${t}"` : ''}>${t}</button>`).join('');
  const on = $('#weeks [aria-pressed=true]');
  $('#weeks').scrollLeft = on.offsetLeft - ($('#weeks').clientWidth - on.offsetWidth) / 2; // centre the chosen week
  fade();
}
function fade() {
  const w = $('#weeks'), end = w.scrollWidth - w.clientWidth;
  w.style.setProperty('--l', w.scrollLeft > 1 ? '40px' : '0px');
  w.style.setProperty('--r', w.scrollLeft < end - 1 ? '40px' : '0px');
}
$('#weeks').onscroll = fade;
addEventListener('resize', fade);
$('#weeks').onclick = e => { const b = e.target.closest('button'); if (!b) return; week = +b.dataset.w; weeks(); start(); };
$('#mQuiz').onclick = () => setMode('quiz');
$('#mCards').onclick = () => setMode('cards');
function setMode(m) { mode = m; $('#mQuiz').ariaPressed = m === 'quiz'; $('#mCards').ariaPressed = m === 'cards'; start(); }
function start() { mode === 'quiz' ? startQuiz(pick(QUIZ)) : startCards(); scrollTo(0, 0); }

function startQuiz(list) { deck = shuffle(list.slice()); i = 0; score = 0; wrong = []; renderQ(); }
function renderQ() {
  if (!deck.length) { view.innerHTML = '<p class="sub">No questions for this week.</p>'; return; }
  if (i >= deck.length) return renderEnd();
  const q = deck[i]; done = false;
  view.innerHTML = `
    <div class="meta"><span>${i + 1} / ${deck.length} · Week ${q.w}</span><span>${score} correct</span></div>
    <div class="bar"><i style="width:${i / deck.length * 100}%"></i></div>
    <p class="q">${inline(q.q)}</p>
    <div class="opts">${order(q).map(n => `<button class="opt" data-n="${n}">${inline(q.o[n])}</button>`).join('')}</div>
    <div id="after"></div>`;
}
view.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('opt') && !done) answer(+b.dataset.n);
  else if (b.id === 'next') { i++; renderQ(); scrollTo(0, 0); }
  else if (b.id === 'redo') startQuiz(wrong);
  else if (b.id === 'again') start();
  else if (b.id === 'flip' || b.classList.contains('card')) { flipped = !flipped; renderCard(); }
  else if (b.id === 'prev') { ci = (ci - 1 + cards.length) % cards.length; flipped = false; renderCard(); }
  else if (b.id === 'nextc') { ci = (ci + 1) % cards.length; flipped = false; renderCard(); }
};
function answer(n) {
  const q = deck[i]; done = true;
  if (n === q.a) score++; else wrong.push(q);
  view.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.n;
    b.disabled = true;
    if (k === q.a) b.classList.add('right'); else if (k === n) b.classList.add('wrong');
  });
  $('#after').innerHTML = `
    <div class="why">
      <p>${n === q.a ? '<b>Correct.</b> ' : '<b>Not quite.</b> '}${inline(q.why)}</p>
      ${q.trap ? `<p><span class="trap">Trap:</span> ${inline(q.trap)}</p>` : ''}
      <p class="src">Week ${q.w}${q.p ? ' · PDF p' + q.p : ''}</p>
    </div>
    <div class="row"><button class="btn" id="next">${i + 1 < deck.length ? 'Next' : 'See score'}</button></div>`;
  $('#next').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); // keep "why" + Next on screen
  $('#next').focus({ preventScroll: true });
}
function renderEnd() {
  view.innerHTML = `
    <p class="big">${score} / ${deck.length}</p>
    <p class="sub">${Math.round(score / deck.length * 100)}% correct. ${wrong.length ? 'Redo the misses while they are fresh.' : 'Clean sweep.'}</p>
    <div class="row">
      ${wrong.length ? `<button class="btn" id="redo">Redo ${wrong.length} wrong</button>` : ''}
      <button class="btn ghost" id="again">Start over</button>
    </div>`;
}

function startCards() { cards = shuffle(pick(CARDS).slice()); ci = 0; flipped = false; renderCard(); }
// shrink a long formula to the card's width (not below 75%) rather than make it scroll
function fit() {
  view.querySelectorAll('.katex-display > .katex').forEach(k => {
    k.style.fontSize = '';
    const r = k.parentNode.clientWidth / k.parentNode.scrollWidth;
    if (r < 1) k.style.fontSize = Math.max(r * .98, .75) * 1.21 + 'em'; // 1.21em = KaTeX's own size
  });
}
function renderCard() {
  if (!cards.length) { view.innerHTML = '<p class="sub">No formula cards for this week.</p>'; return; }
  const c = cards[ci];
  view.innerHTML = `
    <div class="meta"><span>${ci + 1} / ${cards.length} · Week ${c.w}</span><span>tap card to flip</span></div>
    <div class="bar"><i style="width:${(ci + 1) / cards.length * 100}%"></i></div>
    <button class="card${flipped ? ' back' : ''}" aria-label="Flip card">
      ${flipped ? `<span class="f">${[].concat(c.f).map(f => tex(f, true)).join('')}</span><span class="n">${inline(c.n || '')}</span>` : `<span class="t">${inline(c.t)}</span><span class="hint">What's the formula?</span>`}
    </button>
    <div class="row">
      <button class="btn ghost" id="prev">Prev</button>
      <button class="btn ghost" id="flip">Flip</button>
      <button class="btn" id="nextc">Next</button>
    </div>`;
  fit(); document.fonts.ready.then(fit); // refit once KaTeX fonts arrive
}

weeks(); start();
</script>
</body>
</html>
