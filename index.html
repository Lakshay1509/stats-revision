<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stats Revision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141414; --canvas: #fff; --soft: #f3f3f3; --field: #f0f0f0;
    --hair: #e0e0e0; --muted: #707070; --faint: #adadad; --accent: #0066ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--canvas); color: var(--ink);
    font: 450 16px/1.38 Inter, -apple-system, "Helvetica Neue", Arial, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 48px; }

  nav { position: sticky; top: 12px; z-index: 5; margin: 12px auto 0; max-width: 608px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--soft); border-radius: 9999px; padding: 6px 6px 6px 20px; }
  nav b { font-weight: 650; }
  .seg { display: flex; background: var(--field); border-radius: 9999px; padding: 4px; }
  .seg button { background: none; border-radius: 9999px; padding: 8px 16px; font-weight: 600; color: var(--muted); min-height: 40px; }
  .seg button[aria-pressed=true] { background: var(--canvas); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

  .weeks { display: flex; gap: 8px; overflow-x: auto; padding: 24px 0 8px; scrollbar-width: none; }
  .weeks button { flex: none; background: var(--canvas); border: 1px solid var(--hair); border-radius: 9999px;
    padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 40px; }
  .weeks button[aria-pressed=true] { background: var(--ink); border-color: var(--ink); color: #fff; }

  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; margin: 16px 0 8px; }
  .bar { height: 4px; background: var(--soft); border-radius: 9999px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ink); transition: width .2s; }

  h1 { font-weight: 650; font-size: 24px; line-height: 1.25; margin: 24px 0 20px; }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; background: var(--canvas); border: 1px solid var(--hair); border-radius: 28px;
    padding: 14px 20px; min-height: 52px; line-height: 1.38; }
  .opt.right { background: var(--ink); border-color: var(--ink); color: #fff; }
  .opt.right::before { content: "✓  "; }
  .opt.wrong { color: var(--faint); text-decoration: line-through; }
  .opt.wrong::before { content: "✗  "; text-decoration: none; display: inline-block; }
  .opt:disabled { cursor: default; }

  .why { background: var(--soft); border-radius: 16px; padding: 16px 20px; margin-top: 16px; font-size: 15px; }
  .why p { margin: 0 0 8px; } .why p:last-child { margin: 0; }
  .why .src { color: var(--muted); font-size: 12px; }
  .trap { color: var(--accent); font-weight: 600; }

  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { background: var(--ink); color: #fff; border-radius: 9999px; padding: 0 24px; min-height: 48px; font-weight: 600; flex: 1; }
  .btn.ghost { background: var(--canvas); color: var(--ink); border: 1px solid var(--hair); }

  .card { background: var(--soft); border-radius: 24px; padding: 32px 24px; min-height: 300px; margin-top: 20px;
    display: flex; flex-direction: column; justify-content: center; text-align: center; width: 100%; }
  .card span { display: block; }
  .card .t { font-weight: 650; font-size: 24px; line-height: 1.25; }
  .card .f { font-size: 22px; font-weight: 450; line-height: 1.6; margin-bottom: 16px; }
  .card .n { color: var(--muted); font-size: 15px; }
  .card .hint { color: var(--faint); font-size: 12px; margin-top: 16px; }

  .big { font-size: 56px; font-weight: 650; line-height: 1; margin: 48px 0 8px; }
  .sub { font-weight: 300; font-size: 20px; color: var(--muted); margin: 0; }

  footer { background: var(--ink); color: var(--faint); border-radius: 24px 24px 0 0; padding: 32px 24px; text-align: center; font-size: 14px; }
  footer b { color: #fff; font-weight: 650; }
  sub, sup { font-size: .7em; }
</style>
</head>
<body>
<nav>
  <b>Stats revision.</b>
  <div class="seg" role="group" aria-label="Mode">
    <button id="mQuiz" aria-pressed="true">Quiz</button>
    <button id="mCards" aria-pressed="false">Cards</button>
  </div>
</nav>
<main class="wrap">
  <div class="weeks" id="weeks" role="group" aria-label="Week filter"></div>
  <div id="view" aria-live="polite"></div>
</main>
<footer><b>You've got this.</b><br>Statistical Learning for Reliability Analysis · 12 weeks · theory only</footer>

<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const view = $('#view');
let mode = 'quiz', week = 0;
let deck = [], i = 0, score = 0, wrong = [], done = false;
let cards = [], ci = 0, flipped = false;

const shuffle = a => { for (let j = a.length - 1; j > 0; j--) { const k = Math.random() * (j + 1) | 0; [a[j], a[k]] = [a[k], a[j]]; } return a; };
const pick = list => list.filter(x => !week || x.w === week);
// shuffle options so the answer isn't always in the same slot; keep True/False pairs in order
const order = q => { const ix = q.o.map((_, n) => n); return q.o.length > 2 ? shuffle(ix) : ix; };

function weeks() {
  $('#weeks').innerHTML = ['All', ...Array.from({ length: 12 }, (_, n) => 'W' + (n + 1))]
    .map((t, n) => `<button aria-pressed="${n === week}" data-w="${n}">${t}</button>`).join('');
}
$('#weeks').onclick = e => { const b = e.target.closest('button'); if (!b) return; week = +b.dataset.w; weeks(); start(); };
$('#mQuiz').onclick = () => setMode('quiz');
$('#mCards').onclick = () => setMode('cards');
function setMode(m) { mode = m; $('#mQuiz').ariaPressed = m === 'quiz'; $('#mCards').ariaPressed = m === 'cards'; start(); }
function start() { mode === 'quiz' ? startQuiz(pick(QUIZ)) : startCards(); scrollTo(0, 0); }

function startQuiz(list) { deck = shuffle(list.slice()); i = 0; score = 0; wrong = []; renderQ(); }
function renderQ() {
  if (!deck.length) { view.innerHTML = '<p class="sub" style="margin-top:32px">No questions for this week.</p>'; return; }
  if (i >= deck.length) return renderEnd();
  const q = deck[i]; done = false;
  view.innerHTML = `
    <div class="meta"><span>${i + 1} / ${deck.length} · Week ${q.w}</span><span>${score} correct</span></div>
    <div class="bar"><i style="width:${i / deck.length * 100}%"></i></div>
    <h1>${q.q}</h1>
    <div class="opts">${order(q).map(n => `<button class="opt" data-n="${n}">${q.o[n]}</button>`).join('')}</div>
    <div id="after"></div>`;
}
view.onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('opt') && !done) answer(+b.dataset.n);
  else if (b.id === 'next') { i++; renderQ(); scrollTo(0, 0); }
  else if (b.id === 'redo') startQuiz(wrong);
  else if (b.id === 'again') start();
  else if (b.id === 'flip' || b.classList.contains('card')) { flipped = !flipped; renderCard(); }
  else if (b.id === 'prev') { ci = (ci - 1 + cards.length) % cards.length; flipped = false; renderCard(); }
  else if (b.id === 'nextc') { ci = (ci + 1) % cards.length; flipped = false; renderCard(); }
};
function answer(n) {
  const q = deck[i]; done = true;
  if (n === q.a) score++; else wrong.push(q);
  view.querySelectorAll('.opt').forEach(b => {
    const k = +b.dataset.n;
    b.disabled = true;
    if (k === q.a) b.classList.add('right'); else if (k === n) b.classList.add('wrong');
  });
  $('#after').innerHTML = `
    <div class="why">
      <p>${n === q.a ? '<b>Correct.</b> ' : '<b>Not quite.</b> '}${q.why}</p>
      ${q.trap ? `<p><span class="trap">Trap:</span> ${q.trap}</p>` : ''}
      <p class="src">Week ${q.w}${q.p ? ' · PDF p' + q.p : ''}</p>
    </div>
    <div class="row"><button class="btn" id="next">${i + 1 < deck.length ? 'Next' : 'See score'}</button></div>`;
  $('#next').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); // keep "why" + Next on screen
  $('#next').focus({ preventScroll: true });
}
function renderEnd() {
  view.innerHTML = `
    <p class="big">${score} / ${deck.length}</p>
    <p class="sub">${Math.round(score / deck.length * 100)}% correct. ${wrong.length ? 'Redo the misses while they are fresh.' : 'Clean sweep.'}</p>
    <div class="row">
      ${wrong.length ? `<button class="btn" id="redo">Redo ${wrong.length} wrong</button>` : ''}
      <button class="btn ghost" id="again">Start over</button>
    </div>`;
}

function startCards() { cards = shuffle(pick(CARDS).slice()); ci = 0; flipped = false; renderCard(); }
function renderCard() {
  if (!cards.length) { view.innerHTML = '<p class="sub" style="margin-top:32px">No formula cards for this week.</p>'; return; }
  const c = cards[ci];
  view.innerHTML = `
    <div class="meta"><span>${ci + 1} / ${cards.length} · Week ${c.w}</span><span>tap card to flip</span></div>
    <div class="bar"><i style="width:${(ci + 1) / cards.length * 100}%"></i></div>
    <button class="card" aria-label="Flip card">
      ${flipped ? `<span class="f">${c.f}</span><span class="n">${c.n || ''}</span>` : `<span class="t">${c.t}</span><span class="hint">What's the formula?</span>`}
    </button>
    <div class="row">
      <button class="btn ghost" id="prev">Prev</button>
      <button class="btn ghost" id="flip">Flip</button>
      <button class="btn" id="nextc">Next</button>
    </div>`;
}

weeks(); start();
</script>
</body>
</html>
